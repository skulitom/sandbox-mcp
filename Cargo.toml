[package]
name = "sandbox-mcp"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Build, inspect and test Garry's Mod worlds through MCP"

[dependencies]
anyhow = "1"
base64 = "0.22"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
toml_edit = "0.25"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
